[package]
name = "lint"
version = "0.1.1"
edition = "2024"
description = "A versatile linting tool with CLI, MCP, and library interfaces"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/yingkitw/lint"
homepage = "https://github.com/yingkitw/lint"
documentation = "https://docs.rs/lint"
keywords = ["lint", "linter", "cli", "mcp", "code-quality"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "lint"
path = "src/main.rs"

[[bin]]
name = "lint-mcp"
path = "src/mcp_main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
regex = "1.10"
glob = "0.3"
ignore = "0.4"
notify = "6.1"
rayon = "1.10"
colored = "2.1"
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"
